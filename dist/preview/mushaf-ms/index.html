<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hafızyol — Mehmed Şevki mushaf önizleme</title>
    <link rel="stylesheet" href="/assets/mushaf/qcf-mushaf.css?v=qcf6" />
    <link rel="stylesheet" href="/preview/mushaf-fonts/font-preview.css?v=3" />
    <link rel="stylesheet" href="/preview/mushaf-ms/composite.css?v=3" />
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var page = q.get("page") || "1";
        var ms = q.get("ms") || "mehmed-sevki-gart";
        var mode = q.get("mode") || "composite";
        var font = q.get("font") || "qcf-v2";
        if (!/kuran/i.test(location.search)) {
          history.replaceState(
            null,
            "",
            location.pathname +
              "?kuran=1&page=" +
              page +
              "&ms=" +
              ms +
              "&mode=" +
              mode +
              "&font=" +
              font
          );
        }
        window.__HY_SEVKI = { mode: mode, font: font, page: page };
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="hy-ms-shell">
        <div class="hy-qcf-frame-mount" aria-hidden="true">
          <div><div><div id="hy-row-0"></div></div></div>
        </div>
      </div>
    </div>
    <script src="/preview/mushaf-ms/sevki-composite.js?v=3"></script>
    <script src="/preview/mushaf-ms/composite-boot.js?v=4"></script>
    <script>
      (function () {
        var cfg = window.__HY_SEVKI || {};
        if (cfg.mode === "original") return;
        if (cfg.font !== "qcf-v2") {
          var f = document.createElement("script");
          f.src = "/preview/mushaf-fonts/font-preview.js?v=3";
          f.onload = function () {
            if (window.hyFontPreview && window.hyFontPreview.bootSevki) {
              window.hyFontPreview.bootSevki(cfg.font, parseInt(cfg.page, 10));
            }
          };
          document.body.appendChild(f);
          return;
        }
        var t = document.createElement("script");
        t.src = "/assets/timing/quran-timing.js?v=qcf6";
        document.body.appendChild(t);
        var m = document.createElement("script");
        m.src = "/assets/mushaf/qcf-mushaf.js?v=qcf6";
        document.body.appendChild(m);
      })();
    </script>
  </body>
</html>
